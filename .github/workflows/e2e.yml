name: E2E Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit/integration tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start Supabase
        run: supabase start

      - name: Reset and seed database
        run: supabase db reset

      - name: Export Supabase local keys
        run: |
          supabase status -o env > /tmp/supabase.env
          ANON=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2-)
          SRK=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2-)
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SRK" >> $GITHUB_ENV
          echo "anon key length: ${#ANON}, service_role key length: ${#SRK}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: test-session-secret-at-least-32-chars!!
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
          STRIPE_PRICE_ID_1_YEAR_SUB: price_test_placeholder
          HTTPSMS_API_KEY: test
          HTTPSMS_SENDER_NUMBER: "+1234567890"
          HTTPSMS_SENDER_NUMBER_PL: "+1234567890"
          RESEND_API_KEY: re_test_placeholder
          EMAIL_FROM: test@example.com
          EMAIL_ADMIN: test@example.com
          ADMIN_EMAIL_FOR_PLATE_IMPORT: test@example.com
        run: npm run build

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: test-session-secret-at-least-32-chars!!
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
          STRIPE_PRICE_ID_1_YEAR_SUB: price_test_placeholder
          HTTPSMS_API_KEY: test
          HTTPSMS_SENDER_NUMBER: "+1234567890"
          HTTPSMS_SENDER_NUMBER_PL: "+1234567890"
          RESEND_API_KEY: re_test_placeholder
          EMAIL_FROM: test@example.com
          EMAIL_ADMIN: test@example.com
          ADMIN_EMAIL_FOR_PLATE_IMPORT: test@example.com
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
